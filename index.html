<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PS5 Hub - Explore PS5 consoles, prices, specifications, games and accessories.">
<title>PS5 HUB | PlayStation 5</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

:root {
    --bg: #05050b;
    --card: #10101b;
    --card2: #151522;
    --blue: #00aaff;
    --purple: #7b2cff;
    --white: #ffffff;
    --muted: #a9adbd;
    --border: rgba(255,255,255,0.09);
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 20% 10%, rgba(0,150,255,.15), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(120,0,255,.14), transparent 30%),
        var(--bg);
    color: var(--white);
    overflow-x: hidden;
}

/* NAVBAR */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    background: rgba(5,5,11,.75);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    z-index: 1000;
}

.logo {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;
}

.logo span {
    color: var(--blue);
    text-shadow: 0 0 15px var(--blue);
}

.nav-links {
    display: flex;
    gap: 28px;
    list-style: none;
}

.nav-links a {
    color: #ddd;
    text-decoration: none;
    font-size: 14px;
    transition: .3s;
}

.nav-links a:hover {
    color: var(--blue);
}

.menu {
    display: none;
    font-size: 28px;
    cursor: pointer;
}

/* HERO */

.hero {
    min-height: 100vh;
    padding: 150px 8% 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 50px;
    position: relative;
}

.hero-content {
    max-width: 650px;
}

.tag {
    display: inline-block;
    padding: 8px 15px;
    border: 1px solid rgba(0,170,255,.4);
    border-radius: 30px;
    color: var(--blue);
    background: rgba(0,170,255,.06);
    margin-bottom: 22px;
    font-size: 13px;
}

.hero h1 {
    font-size: clamp(48px, 8vw, 90px);
    line-height: .95;
    letter-spacing: -4px;
}

.gradient {
    background: linear-gradient(90deg, #fff, #5ecbff, #8d52ff);
    -webkit-background-clip: text;
    color: transparent;
}

.hero p {
    margin: 25px 0;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.7;
}

.buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    display: inline-block;
    padding: 14px 23px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    transition: .3s;
}

.btn-primary {
    color: white;
    background: linear-gradient(90deg, #008cff, #7137ff);
    box-shadow: 0 0 25px rgba(0,140,255,.3);
}

.btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 40px rgba(0,140,255,.55);
}

.btn-outline {
    border: 1px solid #444;
    color: white;
}

.btn-outline:hover {
    border-color: var(--blue);
    color: var(--blue);
}

/* PS5 VISUAL */

.console-visual {
    width: 360px;
    height: 480px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.console {
    width: 150px;
    height: 370px;
    background: linear-gradient(90deg, #d9dce3, #fff, #c8cbd2);
    border-radius: 22px 22px 30px 30px;
    position: relative;
    box-shadow:
        0 0 30px rgba(255,255,255,.15),
        0 0 100px rgba(0,150,255,.2);
    transform: perspective(600px) rotateY(-12deg);
}

.console:before,
.console:after {
    content: "";
    position: absolute;
    width: 190px;
    height: 45%;
    background: linear-gradient(120deg, #f5f7fa, #bfc4ce);
    z-index: -1;
}

.console:before {
    left: -38px;
    top: 10px;
    border-radius: 50% 10px 10px 50%;
    transform: skewY(-7deg);
}

.console:after {
    right: -38px;
    bottom: 10px;
    border-radius: 10px 50% 50% 10px;
    transform: skewY(7deg);
}

.blue-light {
    position: absolute;
    width: 4px;
    height: 340px;
    background: #00aaff;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 18px #00aaff;
}

/* SECTIONS */

section {
    padding: 90px 8%;
}

.section-title {
    text-align: center;
    margin-bottom: 55px;
}

.section-title small {
    color: var(--blue);
    text-transform: uppercase;
    letter-spacing: 3px;
}

.section-title h2 {
    font-size: 42px;
    margin-top: 10px;
}

.section-title p {
    color: var(--muted);
    margin-top: 12px;
}

/* CARDS */

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.card {
    background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 28px;
    transition: .35s;
    position: relative;
    overflow: hidden;
}

.card:hover {
    transform: translateY(-8px);
    border-color: rgba(0,170,255,.5);
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
}

.card:before {
    content: "";
    position: absolute;
    width: 150px;
    height: 150px;
    background: var(--blue);
    filter: blur(90px);
    opacity: .08;
    right: -50px;
    top: -50px;
}

.console-image {
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.mini-console {
    height: 190px;
    width: 75px;
    border-radius: 14px;
    background: linear-gradient(90deg,#c9ccd2,#fff,#c4c8cf);
    box-shadow: 0 10px 40px rgba(0,170,255,.18);
}

.card h3 {
    font-size: 25px;
    margin-bottom: 8px;
}

.card .edition {
    color: var(--muted);
    font-size: 14px;
}

.price {
    font-size: 30px;
    font-weight: bold;
    margin: 20px 0;
}

.card-btn {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 12px;
    background: #20202d;
    color: white;
    cursor: pointer;
    transition: .3s;
}

.card-btn:hover {
    background: var(--blue);
}

/* SPECS */

.spec-container {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 20px;
}

table {
    width: 100%;
    min-width: 700px;
    border-collapse: collapse;
    background: rgba(255,255,255,.02);
}

th, td {
    padding: 18px;
    text-align: left;
    border-bottom: 1px solid var(--border);
}

th {
    color: var(--blue);
}

td {
    color: #ddd;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 20px;
}

.stat {
    text-align: center;
    padding: 30px 15px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: rgba(255,255,255,.03);
}

.stat h3 {
    font-size: 34px;
    color: var(--blue);
    text-shadow: 0 0 20px rgba(0,170,255,.5);
}

.stat p {
    margin-top: 8px;
    color: var(--muted);
}

/* GAMES */

.game {
    height: 230px;
    border-radius: 20px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    position: relative;
    background: linear-gradient(145deg,#171724,#080810);
}

.game:nth-child(2) {
    background: linear-gradient(145deg,#202018,#090909);
}

.
